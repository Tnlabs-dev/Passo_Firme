name: Testes do frontend

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Executar testes
        run: node --test tests/roleta-layout.test.js

