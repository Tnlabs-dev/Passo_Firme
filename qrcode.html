<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Passo Firme — QR Code da Roleta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="config-loja.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1/build/qrcode.min.js"></script>
    <style>
        :root { --principal: #0D2E46; --destaque: #B02C3A; --fundo: #F3F6F8; --texto: #263844; --borda: #D8E1E6; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; padding: 24px; display: grid; place-items: center; background: var(--fundo); color: var(--texto); font-family: 'Montserrat', sans-serif; }
        .cartaz { width: min(100%, 560px); background: #fff; border: 1px solid var(--borda); border-radius: 24px; box-shadow: 0 18px 45px rgba(13, 46, 70, .12); padding: 38px 42px; text-align: center; }
        .logo { display: block; max-width: 250px; max-height: 120px; margin: 0 auto 24px; object-fit: contain; }
        .etiqueta { margin: 0 0 8px; color: var(--destaque); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
        h1 { margin: 0 0 10px; color: var(--principal); font: 700 34px/1.15 'Playfair Display', serif; }
        .intro { max-width: 420px; margin: 0 auto 24px; color: #687985; font-size: 15px; line-height: 1.55; }
        .qr-area { width: 312px; max-width: 100%; min-height: 312px; display: grid; place-items: center; margin: 0 auto 20px; padding: 16px; border: 3px solid var(--principal); border-radius: 20px; background: white; }
        canvas { width: 280px !important; height: 280px !important; max-width: 100%; }
        .passos { display: grid; gap: 10px; margin: 22px 0; padding: 0; list-style: none; counter-reset: passo; text-align: left; }
        .passos li { counter-increment: passo; position: relative; min-height: 34px; padding: 7px 0 7px 44px; font-size: 14px; line-height: 1.45; }
        .passos li::before { content: counter(passo); position: absolute; left: 0; top: 2px; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--destaque); color: white; font-weight: 700; }
        .url { margin: 12px 0 0; color: #687985; font-size: 10px; overflow-wrap: anywhere; }
        .erro { color: var(--destaque); font-size: 13px; line-height: 1.5; }
        button { width: min(100%, 300px); margin-top: 24px; padding: 14px 18px; border: 0; border-radius: 999px; background: var(--destaque); color: white; font: 700 13px 'Montserrat', sans-serif; cursor: pointer; text-transform: uppercase; }
        @media (max-width: 520px) { body { padding: 12px; } .cartaz { padding: 28px 20px; } h1 { font-size: 29px; } .qr-area { width: 286px; min-height: 286px; } canvas { width: 254px !important; height: 254px !important; } }
        @media print {
            @page { size: A4 portrait; margin: 12mm; }
            body { min-height: auto; padding: 0; background: white; }
            .cartaz { width: 100%; max-width: none; border: 2px solid var(--principal); border-radius: 18px; box-shadow: none; padding: 22mm 18mm; }
            button { display: none; }
        }
    </style>
</head>
<body>
    <main class="cartaz">
        <img class="logo" data-loja-logo alt="Logo da loja">
        <p class="etiqueta">Roleta de prêmios</p>
        <h1>Escaneie e participe</h1>
        <p class="intro">Use a câmera do celular para abrir a roleta. Depois, peça seu código temporário no caixa.</p>
        <div class="qr-area" id="qr-area"><canvas id="qr-code" aria-label="QR Code permanente da roleta"></canvas></div>
        <ol class="passos">
            <li>Escaneie este QR Code e preencha seus dados.</li>
            <li>Peça à equipe o código temporário de 6 números.</li>
            <li>Digite o código, gire a roleta e descubra seu prêmio.</li>
        </ol>
        <p class="url" id="url-roleta"></p>
        <button type="button" onclick="window.print()">Imprimir este cartaz</button>
    </main>
    <script>
        const areaQr = document.getElementById("qr-area");
        document.getElementById("url-roleta").textContent = LojaConfig.roletaUrl;

        try {
            if (typeof QRCode === "undefined") throw new Error("Biblioteca de QR Code indisponível.");
            QRCode.toCanvas(document.getElementById("qr-code"), LojaConfig.roletaUrl, {
                width: 280,
                margin: 2,
                errorCorrectionLevel: "H",
                color: { dark: LojaConfig.cores.principal, light: "#FFFFFF" }
            });
        } catch (erroQr) {
            areaQr.innerHTML = '<p class="erro">Não foi possível montar o QR Code agora. Recarregue a página com a internet conectada antes de imprimir.</p>';
        }
    </script>
</body>
</html>
