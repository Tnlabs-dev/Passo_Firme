<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passo Firme — Gerar Convite (Uso Interno)</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <script src="config-loja.js"></script>

    <style>
        :root {
            --cor-fundo: #F3F6F8;
            --cor-azul-marinho: #0D2E46;
            --cor-vermelho: #B02C3A;
            --cor-borda: #D8E1E6;
            --cor-texto: #263844;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--cor-fundo);
            color: var(--cor-texto);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
        }
        .painel {
            background: white;
            max-width: 380px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            padding: 36px 30px;
            text-align: center;
        }
        .marca-painel {
            margin-bottom: 22px;
            color: var(--cor-azul-marinho);
            font-family: 'Playfair Display', serif;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: .14em;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--cor-azul-marinho);
            font-size: 24px;
            margin: 0 0 6px 0;
        }
        .subtitulo {
            font-size: 13px;
            color: #999;
            margin: 0 0 28px 0;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            margin-bottom: 6px;
        }
        input:focus {
            outline: none;
            border-color: var(--cor-vermelho);
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #CC4452, var(--cor-vermelho));
            color: white;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 14px;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        button.secundario {
            background: transparent;
            color: var(--cor-azul-marinho);
            border: 2px solid var(--cor-azul-marinho);
            padding: 13px;
        }
        #tela-codigo { display: none; }
        .codigo-texto {
            font-family: 'Courier New', monospace;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 6px;
            background: #EDF3F6;
            border: 1px solid var(--cor-borda);
            border-radius: 10px;
            padding: 18px 10px;
            margin: 12px 0 8px;
            color: var(--cor-azul-marinho);
        }
        .validade-codigo {
            font-size: 12px;
            color: #777;
            line-height: 1.6;
            margin: 0 0 14px;
        }
        .retorno-copia {
            min-height: 16px;
            margin: 7px 0 0;
            color: #287A5B;
            font-size: 11px;
            text-align: center;
        }
        .aviso-erro {
            color: var(--cor-vermelho);
            font-size: 12px;
            text-align: left;
            margin: 0 0 14px 0;
            min-height: 14px;
        }
        .link-admin {
            display: inline-block;
            margin-top: 18px;
            color: var(--cor-azul-marinho);
            font-size: 11px;
            text-decoration: none;
        }
        .link-admin:hover { text-decoration: underline; }
        .atalho-qr {
            display: block;
            margin-top: 14px;
            padding: 12px;
            border: 1px solid var(--cor-borda);
            border-radius: 10px;
            color: var(--cor-azul-marinho);
            background: #F7FAFB;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="painel">
    <div class="marca-painel" data-loja-nome>PASSO FIRME</div>

    <div id="tela-senha">
        <h1>Liberar Participação</h1>
        <p class="subtitulo">Uso interno — gere um código depois de confirmar a compra.</p>
        <input type="password" id="senha" placeholder="Senha da equipe" inputmode="numeric" autocomplete="off">
        <p class="aviso-erro" id="erro-senha"></p>
        <button id="botao-gerar" onclick="gerarConvite()">Gerar Código</button>
        <a class="atalho-qr" href="qrcode.html" target="_blank" rel="noopener">Imprimir QR Code fixo da loja</a>
    </div>

    <div id="tela-codigo">
        <h1>Código Liberado</h1>
        <p class="subtitulo">Informe estes seis números à cliente.</p>
        <div class="codigo-texto" id="codigo-texto"></div>
        <p class="validade-codigo" id="validade-codigo"></p>
        <p class="validade-codigo" id="nome-campanha"></p>
        <button class="secundario" id="botao-copiar-codigo" type="button" onclick="copiarCodigo()">Copiar Código</button>
        <p class="retorno-copia" id="retorno-copia" role="status" aria-live="polite"></p>
        <button onclick="reiniciar()">Gerar Novo Código</button>
        <a class="atalho-qr" href="qrcode.html" target="_blank" rel="noopener">Abrir QR Code fixo para impressão</a>
    </div>

    <a class="link-admin" href="admin.html">Acessar área administrativa</a>

</div>

<script>
    const URL_API = LojaConfig.apiUrl;
    let codigoAtual = "";

    // Lembra a senha dentro da mesma aba/sessão do navegador, pra
    // vendedora não precisar redigitar a cada cliente — some sozinha
    // se fechar a aba.
    const CHAVE_SENHA_EQUIPE = LojaConfig.chavesSessao.equipe;
    const senhaMemorizada = sessionStorage.getItem(CHAVE_SENHA_EQUIPE);
    if (senhaMemorizada) {
        document.getElementById("senha").value = senhaMemorizada;
    }

    async function gerarConvite() {
        const senha = document.getElementById("senha").value.trim();
        const botao = document.getElementById("botao-gerar");
        const erro = document.getElementById("erro-senha");
        erro.innerText = "";

        if (!senha) {
            erro.innerText = "Digite a senha da equipe.";
            return;
        }

        botao.disabled = true;
        botao.innerText = "Gerando...";

        try {
            const resposta = await fetch(`${URL_API}/gerar-convite`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ senha: senha })
            });

            let dados;
            try {
                dados = await resposta.json();
            } catch (erroDeLeitura) {
                // A resposta não veio em JSON — normalmente é uma página
                // de erro temporária do servidor "acordando" do modo de
                // economia de energia, não um problema real de conexão.
                erro.innerText = "O servidor ainda está iniciando (comum na primeira chamada depois de um tempo parado). Aguarde uns 20-30 segundos e tente de novo.";
                botao.disabled = false;
                botao.innerText = "Gerar Código";
                return;
            }

            if (!resposta.ok) {
                erro.innerText = dados.detail || "Não foi possível gerar o convite.";
                botao.disabled = false;
                botao.innerText = "Gerar Código";
                return;
            }

            sessionStorage.setItem(CHAVE_SENHA_EQUIPE, senha);
            exibirCodigo(
                dados.codigo || dados.token,
                dados.campanha,
                dados.expira_em,
                dados.validade_minutos
            );

        } catch (e) {
            erro.innerText = "Erro de conexão. Verifique a internet e tente de novo.";
        }

        botao.disabled = false;
        botao.innerText = "Gerar Código";
    }

    function exibirCodigo(codigo, campanha, expiraEm, validadeMinutos) {
        codigoAtual = String(codigo || "").replace(/\D/g, "");
        const codigoFormatado = codigoAtual.length === 6
            ? `${codigoAtual.slice(0, 3)} ${codigoAtual.slice(3)}`
            : codigoAtual;
        document.getElementById("codigo-texto").innerText = codigoFormatado;
        document.getElementById("retorno-copia").innerText = "";
        document.getElementById("nome-campanha").innerText = campanha
            ? `Campanha: ${campanha}`
            : "";

        const expiracao = expiraEm ? new Date(expiraEm) : null;
        const horario = expiracao && !Number.isNaN(expiracao.getTime())
            ? expiracao.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
            : "o horário informado";
        document.getElementById("validade-codigo").innerText =
            `Válido por ${validadeMinutos || 30} minutos, até ${horario}. Depois disso, gere outro código.`;

        document.getElementById("tela-senha").style.display = "none";
        document.getElementById("tela-codigo").style.display = "block";
    }

    async function copiarCodigo() {
        if (!codigoAtual) return;

        const retorno = document.getElementById("retorno-copia");
        const botao = document.getElementById("botao-copiar-codigo");

        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(codigoAtual);
            } else {
                const campoTemporario = document.createElement("textarea");
                campoTemporario.value = codigoAtual;
                campoTemporario.setAttribute("readonly", "");
                campoTemporario.style.position = "fixed";
                campoTemporario.style.opacity = "0";
                document.body.appendChild(campoTemporario);
                campoTemporario.select();
                const copiado = document.execCommand("copy");
                campoTemporario.remove();
                if (!copiado) throw new Error("Cópia não autorizada pelo navegador.");
            }

            retorno.innerText = "Código copiado.";
            botao.innerText = "Código Copiado";
            window.setTimeout(() => { botao.innerText = "Copiar Código"; }, 2200);
        } catch (erroCopia) {
            retorno.innerText = "Não foi possível copiar automaticamente. Informe os seis números exibidos acima.";
        }
    }

    function reiniciar() {
        document.getElementById("tela-codigo").style.display = "none";
        document.getElementById("tela-senha").style.display = "block";
        document.getElementById("retorno-copia").innerText = "";
        codigoAtual = "";
    }
</script>

</body>
</html>
